name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npm run typecheck

      # Non bloquante volontairement. Les 26 alertes high/critical actuelles
      # proviennent toutes de la chaine d'outils Expo/Metro/React Native, et
      # `npm audit fix` non-breaking n'en resout aucune : seul un upgrade du
      # SDK (expo + react-native, deps directes) y parvient. Bloquer ici
      # rendrait le CI rouge en permanence, avec le risque bien pire qu'on
      # s'habitue a ignorer un CI rouge et qu'on rate une vraie regression.
      # Le rapport reste visible dans les logs.
      # A rebasculer en bloquant des que le SDK aura ete monte.
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
